project_id = "supabase-agent"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

# Merged in by the headless-app block for the mcp-sql template: seed.sql sets the
# local executor password and seed/*.sql holds optional demo data.
[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed/*.sql"]

[storage]
enabled = true
file_size_limit = "50MB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]

# Adds the MCP resource URL to OAuth access tokens (audience binding). See the
# mcp_access_token_hook migration (mcp-server).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/mcp_custom_access_token_hook"

# OAuth 2.1 authorization server. The consent screen is served by mcp-auth-ui.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent/"
allow_dynamic_registration = true

[edge_runtime]
enabled = true
# per_worker keeps the worker (and the agent SQL pool) warm across requests.
# oneshot spawns a fresh worker per request, which rebuilds the pool and reruns
# the cold connect + attestation every time. Restart `functions serve` after
# editing function code, since per_worker does not hot-reload.
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[functions.mcp-server]
# The function verifies the bearer token itself (OAuth protected resource).
verify_jwt = false
